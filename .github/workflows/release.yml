name: Release

# 与 Go SDK 一致的发布方式：改 VERSION 文件 → 合并到 main → 自动打 tag 并创建 Release。
# 与 Go 版不同的是，这里额外发布到 npm：需要仓库配置 NPM_TOKEN secret，没有则跳过 npm 发布。

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "📌 版本号: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG 已存在，跳过发布"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG 不存在，准备发布"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install and verify
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm type-check
          pnpm test

      - name: Sync version into package.json
        if: steps.check_tag.outputs.exists == 'false'
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: pnpm build

      - name: Smoke test built exports
        if: steps.check_tag.outputs.exists == 'false'
        run: node scripts/smoke-test.mjs

      - name: Publish to npm
        if: steps.check_tag.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "⚠️ 未配置 NPM_TOKEN，跳过 npm 发布（只创建 GitHub Release）"
            exit 0
          fi
          npm publish --access public --no-git-tag-version

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Generate Release Notes
        if: steps.check_tag.outputs.exists == 'false'
        id: release_notes
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## ${TAG}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since ${PREV_TAG}:" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> $GITHUB_OUTPUT
          else
            echo "### Initial release" >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
